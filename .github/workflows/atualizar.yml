name: Atualizar Radar de Lastro

on:
  schedule:
    # de hora em hora, das 6h às 23h em Brasília (o GitHub pode atrasar execuções agendadas;
    # rodar com frequência garante que os dados não fiquem muitas horas parados)
    - cron: "23 9-23,0-2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          sudo apt-get update -y && sudo apt-get install -y poppler-utils
          pip install -r requirements.txt

      # histórico de documentos e textos extraídos ficam em cache entre execuções;
      # só documentos novos são baixados. Se o cache sumir, a primeira execução refaz 90 dias.
      - uses: actions/cache@v4
        with:
          path: |
            raw/fnet
            raw/cvm
            data
          key: dados-${{ github.run_id }}
          restore-keys: |
            dados-
            fnet-

      - name: Rodar pipeline
        run: python pipeline/run.py 7

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
