name: Atualizar Radar de Lastro

on:
  schedule:
    # de hora em hora, das 6h às 23h em Brasília (o GitHub pode atrasar execuções agendadas;
    # rodar com frequência garante que os dados não fiquem muitas horas parados)
    - cron: "23 9-23,0-2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # ações fixadas pelo commit (não pela tag), para que uma tag alterada não rode código novo aqui
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          sudo apt-get update -y && sudo apt-get install -y poppler-utils
          pip install --no-cache-dir -r requirements.txt

      # histórico de documentos e textos extraídos ficam em cache entre execuções;
      # só documentos novos são baixados. Se o cache sumir, a primeira execução refaz 90 dias.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            raw/fnet
            raw/cvm
            raw/fiagro
            data
          key: dados-${{ github.run_id }}
          restore-keys: |
            dados-
            fnet-

      - name: Rodar pipeline
        run: python pipeline/run.py 7

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
